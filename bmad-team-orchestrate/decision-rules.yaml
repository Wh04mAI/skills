# Decision Rules for Auto-Decision Engine
# Pattern-based rules for common decision scenarios

rules:
  # Cross-cutting issues should be deferred
  - id: cross-cutting-defer
    pattern: "cross-cutting|mark.*OpFailed.*孤儿|竞态.*Epic [0-9]|全局.*竞态"
    action: defer
    reason: "与已合并 story 同形，需 cross-cutting 改造，不在单个 story 内修"
    applies_to: ["decision"]

  # Infrastructure routing 409 is acceptable (Epic 3 pattern)
  - id: infra-routing-409
    pattern: "AC.*409.*infrastructure routing|workflow not found.*409|同步.*409"
    action: accept_current
    reason: "Epic 3 范式，infrastructure routing 同步 409 允许（非状态机 precondition）"
    applies_to: ["decision"]

  # High severity patches must be applied
  - id: high-severity-apply
    pattern: "HIGH.*(goroutine 泄漏|鉴权绕过|int.*截断|errmap.*失效|空.*防御|panic|deadlock)"
    action: apply_patch
    reason: "合并阻塞级别，必须修"
    applies_to: ["patch"]

  # Medium severity patches should be applied
  - id: medium-severity-apply
    pattern: "MED(IUM)?|MEDIUM"
    action: apply_patch
    reason: "中等严重度，修复成本低"
    applies_to: ["patch"]

  # Low severity can be deferred if time-constrained
  - id: low-severity-defer
    pattern: "LOW.*测试.*断言|LOW.*comment|LOW.*naming"
    action: defer
    reason: "低优先级，可后续优化"
    applies_to: ["patch"]

  # Concurrent operation race conditions - accept last-write-wins
  - id: concurrent-op-race
    pattern: "并发.*操作.*竞态|concurrent.*resize.*race|last-write-wins"
    action: accept_current
    reason: "VMWorkflow 串行处理保证完整执行，last-write-wins 语义可接受"
    applies_to: ["decision"]

  # Epic reference pattern consistency
  - id: epic-consistency
    pattern: "与 Epic [0-9].*一致|reference pattern|范式|保持.*一致"
    action: accept_current
    reason: "保持 Epic 范式一致性，不在单个 story 内破例"
    applies_to: ["decision"]

  # Validation patterns - accept current if matches existing epic
  - id: validation-consistency
    pattern: "验证.*与.*一致|validation.*epic|disk.*shrink.*验证"
    action: accept_current
    reason: "验证逻辑与已有 Epic 一致，保持范式"
    applies_to: ["decision"]

  # AC vs stale published doc — AC always wins. Story ACs are the
  # latest architecture-aligned contract; published docs (e.g.
  # business-api.md §X.Y) may be obsolete. Don't let agent compromise
  # by trying to honor both.
  #
  # auto_decide() can't pick the "AC option" automatically (no fixed
  # option name), so this rule sets reason text but lets the decision
  # escalate to the operator. The reason flags it as a known pattern
  # so the operator can resolve quickly.
  - id: ac-vs-stale-doc
    pattern: "AC.*conflict.*business-api|AC.*vs.*§\\d|AC.*differs.*published|AC.*vs.*existing.*contract"
    action: ac_wins
    reason: "Story AC reflects latest architecture; published doc may be stale. Apply AC literally; ignore the doc."
    applies_to: ["decision"]

# Escalation rules - when to flag to human
escalate:
  - pattern: "架构.*决议|ADR|breaking change|重大.*变更"
    reason: "架构级决策需人工审批"

  - pattern: "安全.*风险|security|auth.*bypass|鉴权"
    reason: "安全相关决策需人工确认"

  - pattern: "数据.*丢失|data loss|不可逆|删除.*数据"
    reason: "数据安全决策需人工确认"

  - pattern: "API.*兼容|backward.*compat|breaking.*API"
    reason: "API 兼容性决策需人工确认"

# Default actions when no rule matches
defaults:
  decision: escalate  # Unknown decisions escalate to human
  patch: apply_patch  # Unknown patches default to apply (conservative)
