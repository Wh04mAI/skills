# Orchestrate Skill Configuration
# Base defaults — per-project override in _bmad/team/orchestrate.toml

[orchestrator]
# Core orchestration settings
max_concurrent_agents = 5
poll_interval_seconds = 60
pr_poll_interval_seconds = 120

[monitor]
# Restrict --monitor to PRs authored by this gh user. Default `@me` partitions
# work per dev so two devs running --monitor in parallel don't double-trigger
# code review or double-respond to DECISION markers. Set to "" to disable
# filtering (single-monitor mode, sees every active PR).
#
# Caveats:
# - PR author is the original opener; reassignment / co-work won't reroute.
# - `@me` resolves via each machine's local `gh auth` — each dev must be
#   authed to their own GitHub account for the partition to actually split.
author_filter = "@me"

[adapter]
# Adapter type selection (auto-detected on first run)
type = "github_pr"  # github_pr | file_scanner | jira | linear

# file_scanner adapter config (default, minimal assumptions)
[adapter.file_scanner]
story_patterns = ["docs/stories/*.md", "stories/*.md", "*.story.md"]
status_marker_regex = "^Status:\\s*(.+)$"
id_pattern_regex = "^#\\s*Story\\s+([0-9.-]+)"

# github_pr adapter config (vm-control-plane — derives status from PR state)
[adapter.github_pr]
story_files_dir = "_bmad-output/implementation-artifacts"

[dispatch]
# Dispatch prompt generation
template = "dispatch-bmad.md"  # dispatch-minimal.md | dispatch-bmad.md

# Agent ID convention: <github-login>-<tool>-<seq>, e.g. "manyu-claude-1".
# Auto-detected at dispatch time from `gh api user --jq .login` (sanitized
# to lowercase alnum, ≤12 chars). Set `agent_id_prefix` below to override
# with a fixed literal (legacy behavior, e.g. "claude" → "claudeA").
#
# agent_id_prefix = "claude"   # uncomment to force literal prefix
agent_tool = "claude"           # tool family slot in the auto-prefix
agent_id_sequence = ["1", "2", "3", "4", "5", "6"]

[github]
# Required CI checks that must be green before the orchestrator posts
# APPROVAL. Merging is always human-driven; the orchestrator never
# auto-merges. Code review itself is run by the dev agent via
# `/bmad-team-review` before posting COMPLETION — not by the monitor.
required_checks = ["Lint", "Test", "Replay Test"]

[security]
# GitHub logins whose ORCHESTRATE:RESPONSE markers are honored. Sub-agents
# refuse responses from any other commenter (defense against marker spoofing
# by random PR commenters or bots). Leave unset to auto-detect via
# `gh api user --jq .login` at dispatch time.
trusted_authors = ["haojianggod", "wswuai"]
