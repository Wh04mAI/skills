# Path-based reviewer selection for bmad-team-review skill.
#
# Order matters: first matching pattern wins. Patterns are glob-style
# (fnmatch) applied to file paths in the diff (relative to repo root).
# Each entry produces a "vote" for a reviewer; the skill aggregates votes
# across all changed files and picks the majority. Ties are broken by the
# fallback_chain order under the writer's exclusion.

[size_overrides]
skip_below = 50            # < 50 LOC: skip review entirely
dual_above = 500           # >= 500 LOC AND >= dual_min_categories: dual review
dual_min_categories = 3

[stopping_rules]
max_rounds = 5
ignore_severity_at_or_below = "P3"
escalate_on_repeated_finding = true
escalate_on_architectural = true

[fallback_chains]
# DeepSeek is the lowest-priority reviewer across the board — it stays
# available as a tie-breaker / last-resort but is never preferred over
# codex or claude. A deepseek-written PR therefore degrades to codex
# review by default (the next item in deepseek's own chain after self-
# exclusion).
codex = ["codex", "claude", "deepseek"]
claude = ["claude", "codex", "deepseek"]
deepseek = ["codex", "claude", "deepseek"]

# Mappings — each [[mappings]] block is one path category.

[[mappings]]
patterns = [
    "**/cmd/egress-gateway/**",
    "**/cmd/host-agent/**",
    "**/internal/hostagent/**",
    "**/internal/egress/**",
    "**/internal/hypervisor/**",
]
reviewer = "codex"
rationale = "Linux internals, syscall correctness, fd / socket lifecycle"

[[mappings]]
patterns = [
    "**/internal/workflow/**",
    "**/internal/api/service/**",
    "**/internal/activity/**",
]
reviewer = "claude"
rationale = "Multi-state reasoning, cross-module consistency, saga compensation"

[[mappings]]
patterns = [
    "**/migrations/**",
    "**/internal/db/query/**",
]
reviewer = "codex"
co_reviewer = "claude"
rationale = "Codex for column / FK / PK / type precision; Claude for ADR / wire-protocol alignment"

[[mappings]]
patterns = [
    "**/internal/api/handler/**",
    "**/internal/api/response/**",
    "**/internal/api/server.go",
]
reviewer = "claude"
rationale = "Boundary lints, contract / route consistency"

[[mappings]]
patterns = ["**/tools/lint/**"]
reviewer = "codex"
rationale = "Tight code, AST-level precision"

[[mappings]]
patterns = [
    "_bmad-output/**",
    "**/architecture/**",
    "**/adr/**",
    "**/*.md",
]
reviewer = "claude"
rationale = "Long-form prose, argumentative reasoning, spec-vs-impl checks"

[[mappings]]
patterns = [
    "deploy/ansible/**",
    ".github/workflows/**",
    "**/Dockerfile",
    "**/Dockerfile.*",
    "**/*.sh",
    "**/scripts/**",
]
reviewer = "claude"
co_reviewer = "codex"
rationale = "Ops / deploy / CI is high-blast-radius — claude for sequencing & failure modes, codex for shell / YAML precision. Routed away from deepseek per the lowest-priority policy."

[[mappings]]
patterns = [
    "**/*_test.go",
    "**/tests/**",
    "**/test/**",
]
reviewer = "codex"
rationale = "Test logic = tight code"

[[mappings]]
patterns = ["**/*"]
reviewer = "codex"
rationale = "Default; codex handles general code well"
